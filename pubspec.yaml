name: repforge
description: Local-first workout tracker for RepForge.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  drift: ^2.33.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  go_router: ^17.2.3
  intl: ^0.20.2
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ^0.11.0

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/icon/
    - assets/templates/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/repforge_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: "assets/icon/repforge_icon.png"
  min_sdk_android: 21
